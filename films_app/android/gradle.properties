# Mengurangi alokasi heap menjadi 2GB, cukup untuk proyek skala menengah
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC

# Mengaktifkan optimasi build
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Pengaturan tambahan untuk Android
android.useAndroidX=true
android.enableJetifier=true